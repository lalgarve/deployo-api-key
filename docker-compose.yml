services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: deployo_api_key
      POSTGRES_USER: deployo_api_key_admin
      POSTGRES_PASSWORD: deployo_api_key_admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployo_api_key_admin -d deployo_api_key"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
